# gitleaks configuration: the default rules plus the known false positives of this repository.
[extend]
useDefault = true

[allowlist]
description = "type names, the golden test fixtures' obvious test tokens, the freeze baselines (sha256 digests of spec files)"
regexes = ['''^Ed25519PrivateKey$''']
paths = ['''^tests/api/golden/.*\.json$''', '''^api/freeze/.*\.json$''']
