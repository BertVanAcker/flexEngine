<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- flexEngineV2 os-rauc (EV-17), optional hardening: rauc-service's stock policy
     (/usr/share/dbus-1/system.d/de.pengutronix.rauc.conf) lets ANY local user install bundles and mark slots.
     This file (processed after it) limits calls to root and group flex, the engine's group.
     Install: sudo install -m 0644 packaging/dbus/flexengine-rauc.conf /etc/dbus-1/system.d/ && sudo systemctl reload dbus
     Check:   sudo -u flex rauc status   (works)   ·   sudo -u nobody rauc status   (AccessDenied) -->
<busconfig>
  <policy context="default">
    <deny send_destination="de.pengutronix.rauc"/>
  </policy>
  <policy group="flex">
    <allow send_destination="de.pengutronix.rauc"/>
  </policy>
  <policy user="root">
    <allow send_destination="de.pengutronix.rauc"/>
  </policy>
</busconfig>
