id: EV-HW-06
title: UNO Q App Lab deploy, update and rollback (remote mode and board-local engine)
description: >
  flexEngineV2 deploys a real App Lab `.ard` release of the UC3 greenhouse to the UNO Q, updates it, rolls a release
  whose MCU firmware does not match its Python side back fail-fast (the runtime FLEX01 handshake), refuses a release
  with skewed sources before install, refuses a plan with two Apps for the board (exclusive executor, 422), and
  removes the App. First with the engine on the LattePanda driving `arduino-app-cli` over ssh (remote mode), then
  with the engine on the UNO Q itself (board-local, arm64 wheels): DA-11 is decided on these two runs. Replaces the
  L7-P3P4 s8 (s2-14/s2-15) procedure.
vars:
  operator: {default: "", prompt: "your name"}
  target: {default: desk, prompt: "desk (real hardware) or sim"}
  lp: {default: "lab@lattepanda.lab", prompt: "LattePanda ssh login"}
  fe_api: {default: "http://lattepanda.lab:8781", prompt: "read-only API of the LattePanda engine (remote mode)"}
  fe_api_token_file: {default: "~/.flexhwtest/fe-api.token", prompt: "bearer token file of the read-only API"}
  fe_api_board: {default: "http://unoq.local:8781", prompt: "read-only API of the engine on the UNO Q (board-local mode)"}
  fe_api_board_token_file: {default: "~/.flexhwtest/fe-api-unoq.token", prompt: "bearer token file of the UNO Q engine's API"}
  cloud_host: {default: "lattepanda.lab", prompt: "flexCloud host (TLS port)"}
  cloud_port: {default: "9700", prompt: "flexCloud TLS port"}
  cloud_url: {default: "https://lattepanda.lab:9700", prompt: "flexCloud admin API base URL"}
  cloud_ca: {default: "~/.flexhwtest/lab-ca.crt", prompt: "lab CA (DATA/stack/tls/ca.crt of the LattePanda)"}
  admin_token_file: {default: "~/.flexhwtest/admin.token", prompt: "flexCloud admin token file"}
  catalog: {default: "${hwtest}/catalogs/lab-d2.yaml", prompt: "release catalog (deskctl)"}
  desk: {default: "${python} ${hwtest}/deskctl.py --cloud ${cloud_url} --ca '${cloud_ca}' --admin-token-file ${admin_token_file} --catalog ${catalog}", prompt: "desk control command"}
  app: {default: unoq, prompt: "device id of the UNO Q in the LattePanda's engine (remote mode)"}
  app_local: {default: unoq-board, prompt: "device id of the engine on the UNO Q (board-local mode)"}
  unoq: {default: "arduino@unoq.local", prompt: "UNO Q ssh login"}
  unoq_board: {default: "arduino@unoq.local", prompt: "UNO Q ssh login for the board-local checks"}
  appcli: {default: arduino-app-cli, prompt: "arduino-app-cli on the UNO Q"}
  appcli_board: {default: arduino-app-cli, prompt: "arduino-app-cli on the UNO Q (board-local part)"}
  dep: {default: greenhouse, prompt: "deployment id"}
setup:
  - "UNO Q: App Lab image, Wi-Fi, ssh key login from the LattePanda's flex user (unoq-setup.sh trust); no user App running"
  - "Remote mode: the LattePanda's engine.yaml has device ${app} with drivers.applab {board: unoq, ssh: ${unoq}, healthVia: logs}"
  - "Board-local mode: flexEngineV2 installed on the UNO Q from the arm64 wheelhouse (packaging/install.sh, EV-HW-01 steps), device ${app_local} with drivers.applab {board: unoq, healthVia: router}, read-only API ${fe_api_board}; it stays stopped during the remote part (one App per board)"
  - "UC3 releases 1.0.0 (v1), 1.1.0 (v2), 1.2.0 (v2 sources + v1 firmware), 1.3.0 (skewed sources) published by unoq-setup.sh build-app + flex release (catalog entries gh_*)"
steps:
  - id: stack
    title: flexCloud TLS port reachable
    check_tcp: {host: "${cloud_host}", port: "${cloud_port}"}
  - id: engine-up
    title: "${app} onboarded and online (remote mode)"
    fe_status_expect: {device: "${app}", device_fields: {onboarded: true, online: true}, timeout: 60}
  - id: appcli-version
    title: arduino-app-cli on the UNO Q answers
    cmd_json_expect: {host: "${unoq}", cmd: "${appcli} version --format json", match: {/version: {regex: "\\d"}, /board: unoq}}
  - id: exclusive
    title: "Capabilities: applab is an exclusive executor (one App per board)"
    http_expect: {url: "${fe_api}/v1/capabilities/${app}", token_file: "${fe_api_token_file}", json_match: {/x-flex/drivers/applab/exclusive: true, /x-flex/drivers/applab/maxDeployments: 1}}
  - id: deploy-10
    title: Deploy 1.0.0
    run: {cmd: "${desk} deploy ${app} ${dep}=gh_1_0_0"}
  - id: v10-installed
    title: 1.0.0 Installed and healthy (contract handshake OK)
    fe_status_expect: {device: "${app}", deployment: "${dep}", state: Installed, version: 1.0.0, health: healthy, timeout: 180}
  - id: v10-running
    title: "`app ps`: 1.0.0 running"
    cmd_json_expect: {host: "${unoq}", cmd: "${appcli} app ps --all --format json", match: {"/apps[release_id=uc3-greenhouse-1-0-0-unoq]/status": running}}
  - id: deploy-11
    title: Update to 1.1.0
    run: {cmd: "${desk} deploy ${app} ${dep}=gh_1_1_0"}
  - id: v11-installed
    title: 1.1.0 Installed and healthy
    fe_status_expect: {device: "${app}", deployment: "${dep}", state: Installed, version: 1.1.0, health: healthy, timeout: 180}
  - id: v11-running
    title: "`app ps`: 1.1.0 running, 1.0.0 stopped"
    cmd_json_expect: {host: "${unoq}", cmd: "${appcli} app ps --all --format json", match: {"/apps[release_id=uc3-greenhouse-1-1-0-unoq]/status": running, "/apps[release_id=uc3-greenhouse-1-0-0-unoq]/status": stopped}}
  - id: deploy-12
    title: Deploy 1.2.0 (v2 Python side, v1 MCU firmware)
    run: {cmd: "${desk} deploy ${app} ${dep}=gh_1_2_0"}
  - id: v12-failed
    title: 1.2.0 Failed fail-fast, rolled back to 1.1.0
    fe_status_expect: {device: "${app}", deployment: "${dep}", state: Failed, version: 1.2.0, fields: {rolledBackTo: 1.1.0, failFast: true, reason: health check failed}, timeout: 180}
  - id: v12-detect
    title: "Detected in < 6 s (fail-fast, not the 15 s health timeout)"
    cmd_json_expect: {cmd: "${desk} device ${app}", match: {"/status/${dep}/detectSeconds": {lt: 6}, "/status/${dep}/rollbackHealthy": true}}
  - id: v11-back
    title: "`app ps`: 1.1.0 running again"
    cmd_json_expect: {host: "${unoq}", cmd: "${appcli} app ps --all --format json", match: {"/apps[release_id=uc3-greenhouse-1-1-0-unoq]/status": running}}
  - id: deploy-13
    title: Deploy 1.3.0 (sources skewed against the contract)
    run: {cmd: "${desk} deploy ${app} ${dep}=gh_1_3_0"}
  - id: v13-refused
    title: 1.3.0 refused before install, 1.1.0 kept
    fe_status_expect: {device: "${app}", deployment: "${dep}", state: Failed, version: 1.3.0, fields: {rolledBackTo: 1.1.0, reason: apply failed}, timeout: 120}
  - id: v13-not-installed
    title: 1.3.0 never reached the board
    cmd_json_expect: {host: "${unoq}", cmd: "${appcli} app list --all --format json", match: {"/apps": {where: {"/release_id": uc3-greenhouse-1-3-0-unoq}, count: 0}}}
  - id: two-apps
    title: A plan with two Apps for the board is refused (422, exclusive executor)
    cmd_json_expect: {cmd: "${desk} deploy ${app} ${dep}=gh_1_0_0 ${dep}-2=gh_1_1_0 --expect 422", match: {/status: 422, /problem/title: "Placement refused: exclusive executor"}}
  - id: remove
    title: Remove the App (empty desired state)
    run: {cmd: "${desk} deploy ${app}"}
  - id: removed
    title: "${dep} removed"
    fe_status_expect: {device: "${app}", deployment: "${dep}", absent: true, timeout: 120}
  - id: board-empty
    title: No App left on the board
    cmd_json_expect: {host: "${unoq}", cmd: "${appcli} app list --releases --format json", match: {/apps: {len: 0}}}
  - id: board-local-start
    title: Start the engine on the UNO Q (board-local mode)
    manual:
      instruction: "On the UNO Q: `sudo systemctl start flexengine` (device ${app_local}); keep the LattePanda's ${app} without deployments."
      sim: "true"
  - id: local-up
    title: "${app_local} onboarded and online"
    fe_status_expect: {device: "${app_local}", api: "${fe_api_board}", token_file: "${fe_api_board_token_file}", device_fields: {onboarded: true, online: true}, timeout: 120}
  - id: local-11
    title: "Board-local: deploy 1.1.0"
    run: {cmd: "${desk} deploy ${app_local} ${dep}=gh_1_1_0"}
  - id: local-11-installed
    title: "Board-local: 1.1.0 Installed and healthy (router handshake)"
    fe_status_expect: {device: "${app_local}", deployment: "${dep}", api: "${fe_api_board}", token_file: "${fe_api_board_token_file}", state: Installed, version: 1.1.0, health: healthy, timeout: 180}
  - id: local-12
    title: "Board-local: deploy 1.2.0"
    run: {cmd: "${desk} deploy ${app_local} ${dep}=gh_1_2_0"}
  - id: local-12-failed
    title: "Board-local: 1.2.0 Failed fail-fast, rolled back to 1.1.0"
    fe_status_expect: {device: "${app_local}", deployment: "${dep}", api: "${fe_api_board}", token_file: "${fe_api_board_token_file}", state: Failed, version: 1.2.0, fields: {rolledBackTo: 1.1.0, failFast: true}, timeout: 180}
  - id: local-detect
    title: "Board-local: detected in < 6 s"
    cmd_json_expect: {cmd: "${desk} device ${app_local}", match: {"/status/${dep}/detectSeconds": {lt: 6}}}
  - id: local-remove
    title: "Board-local: remove the App"
    run: {cmd: "${desk} deploy ${app_local}"}
  - id: local-removed
    title: "Board-local: removed, board empty"
    cmd_json_expect: {host: "${unoq_board}", cmd: "${appcli_board} app list --releases --format json", match: {/apps: {len: 0}}, timeout: 120, every: 2}
