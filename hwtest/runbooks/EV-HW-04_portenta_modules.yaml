id: EV-HW-04
title: Portenta H7 module hot-load and rollback through the LattePanda gateway
description: >
  flexEngineV2 on the LattePanda hot-loads two generated modules (C servo_drive, Rust gripper_station) into the
  Portenta H7 M7 through the see-thru gateway (SMP), relays the gripper state to Zenoh (rmw_zenoh key), rolls a
  stalling servo version back from the A/B socket slot without re-upload (fail-fast), and refuses an ABI-skewed
  module before anything reaches the MCU. Replaces the L7-P3P4 s4 procedure (acc-2, acc-9 recorded there).
vars:
  operator: {default: "", prompt: "your name"}
  target: {default: desk, prompt: "desk (real hardware) or sim"}
  lp: {default: "lab@lattepanda.lab", prompt: "LattePanda ssh login (local = this runner runs on the LattePanda)"}
  fe: {default: "sudo -u flex /opt/flexengine/bin/flexengine", prompt: "flexengine CLI on the LattePanda"}
  fe_host: {default: "${lp}", prompt: "host the flexengine CLI runs on"}
  fe_api: {default: "http://lattepanda.lab:8781", prompt: "engine read-only API (local.tcp bind)"}
  fe_api_token_file: {default: "~/.flexhwtest/fe-api.token", prompt: "bearer token file of the read-only API (DA-7: one per desk)"}
  cloud_host: {default: "lattepanda.lab", prompt: "flexCloud host (TLS port)"}
  cloud_port: {default: "9700", prompt: "flexCloud TLS port"}
  cloud_url: {default: "https://lattepanda.lab:9700", prompt: "flexCloud admin API base URL"}
  cloud_ca: {default: "~/.flexhwtest/lab-ca.crt", prompt: "lab CA (DATA/stack/tls/ca.crt of the LattePanda)"}
  admin_token_file: {default: "~/.flexhwtest/admin.token", prompt: "flexCloud admin token file"}
  catalog: {default: "${hwtest}/catalogs/lab-d2.yaml", prompt: "release catalog (deskctl)"}
  desk: {default: "${python} ${hwtest}/deskctl.py --cloud ${cloud_url} --ca '${cloud_ca}' --admin-token-file ${admin_token_file} --catalog ${catalog}", prompt: "desk control command"}
  svc: {default: "sudo systemctl", prompt: "service control on the LattePanda"}
  gp: {default: panda, prompt: "engine device id of the LattePanda (gateway)"}
  mcu: {default: panda.portenta, prompt: "engine device id of the Portenta (see-thru child)"}
  smp_host: {default: "127.0.0.1", prompt: "SMP TCP bridge (flex-smp-bridge: socat 127.0.0.1:5555 <-> /dev/ttyUSB0) as seen from this runner"}
  smp_port: {default: "5555", prompt: "SMP TCP bridge port"}
  base_version: {default: "1.0.0", prompt: "base image version flashed in D2-BRINGUP s3"}
  zenoh_connect: {default: "tcp/lattepanda.lab:7447", prompt: "Zenoh router the relay publishes to (zenohd on the LattePanda)"}
  zenoh_mode: {default: client, prompt: "Zenoh session mode of this runner (client to zenohd)"}
  model_dir: {default: "${repo}/examples/models/demo-pick", prompt: "flexModel workspace with the uc2 types (CDR decode)"}
setup:
  - "Portenta H7 on the HAT Carrier: MCUboot + flexEngine-MCU base ${base_version} (D2-BRINGUP s3); SMP on uart4 (40-pin header) -> USB-UART adapter -> /dev/ttyUSB0 on the LattePanda (NOT /dev/ttyACM0, that is the USB CDC console)"
  - "flex-smp-bridge (socat) serves /dev/ttyUSB0 at 127.0.0.1:5555 and engine.yaml has ${mcu} with mcu.smp {host: 127.0.0.1, port: 5555}, the FLXM modulePublicKey and relay.enabled with connect ${zenoh_connect}"
  - "Run this runbook ON the LattePanda (lp=local) or tunnel the bridge: ssh -L 5555:127.0.0.1:5555 ${lp} (SMP steps stop the engine first: the UART has one user)"
  - "SWD probe connected for recovery"
steps:
  - id: stack
    title: flexCloud TLS port reachable
    check_tcp: {host: "${cloud_host}", port: "${cloud_port}"}
  - id: gateway-up
    title: "Gateway ${gp} onboarded and online"
    fe_status_expect: {device: "${gp}", device_fields: {onboarded: true, online: true, role: gateway}, timeout: 60}
  - id: child-up
    title: "See-thru child ${mcu} onboarded"
    fe_status_expect: {device: "${mcu}", device_fields: {onboarded: true, role: child-device, parent: "${gp}"}, timeout: 60}
  - id: engine-stop-1
    title: Stop the engine (free the SMP UART for the direct checks)
    ssh_run: {host: "${lp}", cmd: "${svc} stop flexengine"}
  - id: base-confirmed
    title: "SMP image list: MCUboot slot 0 = base ${base_version}, confirmed"
    smp_probe: {host: "${smp_host}", port: "${smp_port}", cmd: image_list, match: {"/images[slot=0]/version": {regex: "^${base_version}"}, "/images[slot=0]/confirmed": true}, timeout: 30}
  - id: base-info
    title: "flexmod info: module ABI 1.0, two sockets"
    smp_probe: {host: "${smp_host}", port: "${smp_port}", cmd: flexmod_info, match: {/abi_major: 1, /sockets: 2, /confirmed: true}, timeout: 30}
  - id: engine-start-1
    title: Start the engine again
    ssh_run: {host: "${lp}", cmd: "${svc} start flexengine"}
  - id: publish
    title: "Publish the module releases (servo 2.0.0, gripper 1.0.0, stalling servo 3.0.0, ABI-2 servo)"
    cmd_json_expect: {cmd: "${desk} publish servo_2 grip_1 servo_stall servo_abi2", match: {"/published": {len: 4}}, cmd_timeout: 1800}
  - id: deploy
    title: Deploy servo 2.0.0 + gripper 1.0.0 to the Portenta
    run: {cmd: "${desk} deploy ${mcu} servo=servo_2 gripper=grip_1"}
  - id: servo-installed
    title: servo Installed 2.0.0
    fe_status_expect: {device: "${mcu}", deployment: servo, state: Installed, version: 2.0.0, health: healthy, timeout: 240}
  - id: gripper-installed
    title: gripper Installed 1.0.0
    fe_status_expect: {device: "${mcu}", deployment: gripper, state: Installed, version: 1.0.0, health: healthy, timeout: 240}
  - id: relay
    title: "Gripper state on Zenoh through the relay (rmw_zenoh key, CDR)"
    zenoh_expect: {connect: "${zenoh_connect}", mode: "${zenoh_mode}", key: "0/gripper_station/state/*/*", decode: "cdr:uc2/GripperState", model: "${model_dir}", match: {/seq: {gt: 0}, /faults: {exists: true}}, timeout: 30}
  - id: mark-stall
    title: History mark
    fe_history_mark: {name: stall, device: "${mcu}"}
  - id: deploy-stall
    title: Deploy the stalling servo 3.0.0 (gripper unchanged)
    run: {cmd: "${desk} deploy ${mcu} --keep servo=servo_stall"}
  - id: stall-failed
    title: 3.0.0 Failed fail-fast, rolled back to 2.0.0
    fe_status_expect: {device: "${mcu}", deployment: servo, state: Failed, version: 3.0.0, fields: {rolledBackTo: 2.0.0, failFast: true}, timeout: 240}
  - id: stall-time
    title: Detection + rollback time from the history
    fe_history_expect: {since: stall, device: "${mcu}", match: [{dep: servo, state: Installing, version: 3.0.0}, {dep: servo, state: Failed, version: 3.0.0}], max_duration: 60, save_duration: stall_s}
  - id: no-reupload
    title: Rollback without re-upload (one apply of 3.0.0, one rollback, 2.0.0 applied only once)
    cmd_json_expect:
      host: "${fe_host}"
      cmd: "${fe} logs --json -n 5000 --device ${mcu}"
      json_lines: true
      match:
        "": {where: {"/source": actions, "/dep": servo, "/action": apply, "/version": 2.0.0}, count: 1}
        "/0/device": "${mcu}"
  - id: rollback-logged
    title: The rollback is in the action log
    cmd_json_expect: {host: "${fe_host}", cmd: "${fe} logs --json -n 5000 --device ${mcu}", json_lines: true, match: {"": {where: {"/source": actions, "/dep": servo, "/action": rollback}, count: {gte: 1}}}}
  - id: deploy-abi2
    title: Deploy the ABI-2 servo build (base image speaks ABI 1)
    run: {cmd: "${desk} deploy ${mcu} --keep servo=servo_abi2"}
  - id: abi2-refused
    title: Refused in preflight, before upload
    fe_status_expect: {device: "${mcu}", deployment: servo, state: Failed, version: 4.0.0-abi2, fields: {reason: {regex: "module ABI 2\\.0 incompatible with base ABI 1\\.0"}}, timeout: 120}
  - id: abi2-no-apply
    title: No apply for the ABI-2 release
    cmd_json_expect: {host: "${fe_host}", cmd: "${fe} logs --json -n 5000 --device ${mcu}", json_lines: true, match: {"": {where: {"/source": actions, "/dep": servo, "/version": 4.0.0-abi2, "/action": {in: [apply, rollback, remove]}}, count: 0}}}
  - id: engine-stop-2
    title: Stop the engine (direct SMP check)
    ssh_run: {host: "${lp}", cmd: "${svc} stop flexengine"}
  - id: sockets
    title: "MCU: servo 2.0.0 confirmed and healthy, gripper 1.0.0 running, one upload of the servo per version"
    smp_probe: {host: "${smp_host}", port: "${smp_port}", cmd: flexmod_status, match: {"/sockets[dep=servo]/version": 2.0.0, "/sockets[dep=servo]/state": confirmed, "/sockets[dep=servo]/healthy": true, "/sockets[dep=gripper]/version": 1.0.0, "/sockets[dep=gripper]/healthy": true}, timeout: 30}
  - id: engine-start-2
    title: Start the engine again
    ssh_run: {host: "${lp}", cmd: "${svc} start flexengine"}
  - id: back-to-2
    title: Desired state back to servo 2.0.0
    run: {cmd: "${desk} deploy ${mcu} --keep servo=servo_2"}
  - id: servo-2-again
    title: servo Installed 2.0.0 without touching the MCU
    fe_status_expect: {device: "${mcu}", deployment: servo, state: Installed, version: 2.0.0, health: healthy, timeout: 120}
  - id: still-one-apply
    title: Still one apply of servo 2.0.0
    cmd_json_expect: {host: "${fe_host}", cmd: "${fe} logs --json -n 5000 --device ${mcu}", json_lines: true, match: {"": {where: {"/source": actions, "/dep": servo, "/action": apply, "/version": 2.0.0}, count: 1}}}
