# GUI metadata of EV-HW-05 (read by the runbook GUI: gui.py --scan flexengine/hwtest); the runbook is EV-HW-05_mcu_firmware.yaml
goal: The Portenta's base image is updated through MCUboot with the modules kept, a never-confirming image reverts, and
  a power cut during the test boot boots the last confirmed image.
duration: ~30 min
boards:
- LattePanda 3 Delta
- Portenta H7 + HAT Carrier
tags:
- flexengine-v2
- mcu
- mcuboot
- firmware
- power cut
target:
  board: portenta_h7
  notes: 'Watch the USB-C console (/dev/ttyACM0): `Swap type: test` / FLEXMCU_READY mark the power-cut window (1.0.0 soaks
    20 s).'
