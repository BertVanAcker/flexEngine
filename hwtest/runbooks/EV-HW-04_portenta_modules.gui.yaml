# GUI metadata of EV-HW-04 (read by the runbook GUI: gui.py --scan flexengine/hwtest); the runbook is EV-HW-04_portenta_modules.yaml
goal: flexEngineV2 on the LattePanda hot-loads a generated module into the Portenta H7 M7 through the see-thru gateway,
  rolls a stalling version back from the A/B slot without re-upload, and refuses an ABI-skewed module before upload.
duration: ~20 min
boards:
- LattePanda 3 Delta
- Portenta H7 + HAT Carrier
tags:
- flexengine-v2
- mcu
- llext
- mcuboot
- rollback
- relay
- zenoh
target:
  board: portenta_h7
  notes: SMP over the HAT Carrier 40-pin UART (uart4) -> USB-UART -> /dev/ttyUSB0 on the LattePanda (socat bridge 127.0.0.1:5555);
    USB-C (/dev/ttyACM0) is the console only. SWD probe connected for recovery; base image and MCUboot from D2-BRINGUP s3.
