# flexEngine 2 release (engine plan §7.6). On a tag v2.*: the push and nightly tiers and the coverage gate, then the
# sdist + wheel to PyPI (project flexEngine) and, with the offline wheelhouse bundles (built around that same wheel)
# and their SHA256SUMS, to the GitHub release. A tag with a, b or rc (v2.0.0rc1) is a pre-release on both: PyPI
# marks it by its version (pip needs --pre), the GitHub release gets --prerelease.
# The file name (release.yml) and the environment (pypi) are what PyPI's trusted publisher for flexEngine is
# registered with; keep both. 0.6.x releases come from branch v1.x, whose own release.yml runs on its v0.* tags.
name: Release
on:
  push:
    tags: ["v2.*"]
  workflow_dispatch: {}      # a dry run: everything except the PyPI upload and the GitHub release
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHON: ${{ github.workspace }}/.venv/bin/python
  FLEX_RESULTS_DIR: ${{ github.workspace }}/results/latest
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
jobs:
  suite:
    name: suite (${{ matrix.tier }})
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: true
      matrix:
        tier: [all, coverage]      # all = push + nightly tiers in one run summary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: system packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q podman
      - name: venv
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -e ".[dev,mcu,applab,plc,otel,relay]" openapi-spec-validator
      - name: alpine:3.20 (base of the container test images)
        run: docker pull -q alpine:3.20
      - run: ./run_tests.sh ${{ matrix.tier }}
        env:
          # applab's integration suite needs the framework's P4 board simulator: its 80 % gate runs in the framework CI
          FLEX_COVERAGE_DEFER: applab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-${{ matrix.tier }}
          path: |
            results/latest/
            tests/work/coverage/coverage.json

  build:
    name: sdist and wheel
    needs: suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: the tag matches flexengine2.__version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/flexengine2/__init__.py)
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match flexengine2.__version__ ($PKG): bump src/flexengine2/__init__.py and tag again"
            exit 1
          fi
      - name: python -m build
        run: python -m pip install -q build && python -m build
      - name: the wheel installs into a clean venv and runs
        run: |
          python -m venv /tmp/smoke && /tmp/smoke/bin/pip install -q dist/*.whl
          /tmp/smoke/bin/flexengine version
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}

  bundles:
    name: offline wheelhouse bundles
    needs: [suite, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: docker/setup-qemu-action@v3
      - uses: actions/download-artifact@v4
        with: {name: dist, path: pypi-dist/}
      - name: bundles around the wheel that goes to PyPI (LattePanda x86_64, UNO Q aarch64) + SHA256SUMS
        run: |
          shopt -s failglob
          packaging/build-wheels.sh --wheel pypi-dist/flexengine-*-py3-none-any.whl
        env:
          PYTHON: python3
      - uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS

  publish-pypi:
    name: Publish to PyPI
    needs: [build, bundles]
    if: startsWith(github.ref, 'refs/tags/v2.')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/flexEngine/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: publish-pypi
    if: startsWith(github.ref, 'refs/tags/v2.')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: actions/download-artifact@v4
        with: {name: bundles, path: bundles/}
      - name: create the release and attach sdist, wheel and bundles
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *a*|*b*|*rc*) pre="--prerelease" ;; esac
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" $pre --verify-tag --title "flexEngine $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* bundles/*.tar.gz bundles/SHA256SUMS --clobber
