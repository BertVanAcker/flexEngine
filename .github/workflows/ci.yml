name: CI

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_call:

jobs:
  test-linux:
    name: Test (Linux, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install flexEngine
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run test suite
        run: pytest tests/ -v

  smoke-install:
    name: Install smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install built wheel and scaffold a workspace
        shell: bash
        run: |
          set -e
          python -m venv smoke-venv
          if [ -f smoke-venv/bin/pip ]; then
            BIN=smoke-venv/bin
          else
            BIN=smoke-venv/Scripts
          fi
          "$BIN/pip" install --quiet dist/*.whl
          "$BIN/flexEngine" --version
          "$BIN/flexEngine" init smoke-workspace --non-interactive
          test -f smoke-workspace/agent.py
          test -f smoke-workspace/configuration/config.yaml
          test -d smoke-workspace/apps
          test -d smoke-workspace/logs
          "$BIN/python" -c "import yaml; yaml.safe_load(open('smoke-workspace/configuration/config.yaml'))"

      - name: Exercise install script against the local build
        if: runner.os != 'Windows'
        shell: bash
        env:
          PIP_FIND_LINKS: ${{ github.workspace }}/dist
          FLEXENGINE_INSTALL_DIR: ${{ runner.temp }}/flexengine-install
          HOME: ${{ runner.temp }}/flexengine-home
        run: |
          mkdir -p "$HOME"
          bash scripts/install.sh --workspace "${{ runner.temp }}/flexengine-install-ws"
          test -f "${{ runner.temp }}/flexengine-install-ws/agent.py"

      - name: Exercise install.ps1 against the local build
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PIP_FIND_LINKS: ${{ github.workspace }}/dist
          FLEXENGINE_INSTALL_DIR: ${{ runner.temp }}\flexengine-install
        run: |
          .\scripts\install.ps1 -Workspace "${{ runner.temp }}\flexengine-install-ws"
          if (-not (Test-Path "${{ runner.temp }}\flexengine-install-ws\agent.py")) {
            throw "agent.py was not scaffolded"
          }

  smoke-install-arm:
    name: Install smoke test (Linux ARMv6, emulated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist/wheel
        run: |
          python3 -m pip install --upgrade pip build
          python3 -m build

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Install + init smoke test under linux/arm/v6 (emulated)
        run: |
          docker run --rm --platform linux/arm/v6 \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            python:3.11-slim \
            bash -c '
              set -e
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends gcc python3-dev
              pip install --quiet --find-links /src/dist flexEngine
              flexEngine --version
              flexEngine init /tmp/smoke-ws --non-interactive
              test -f /tmp/smoke-ws/agent.py
              test -f /tmp/smoke-ws/configuration/config.yaml
            '
