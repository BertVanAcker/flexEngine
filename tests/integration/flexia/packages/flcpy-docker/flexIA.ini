[flexIA]
projectID = sandbox
description = flexCommunicator GettingStarted publisher (flcpy) as a v1 docker workflow

[PACKAGE]
name = flcpy-publisher
tag = flcpy_publisher_001

# DEPLOYMENT OPTIONS
[DEPLOYMENT:option1]
devices = edge1

[build:edge1]
workflow = docker                                   #docker|docker-compose|custom
workflow_link = ""
arguments = ""

[run:edge1]
workflow = docker                                   #docker|docker-compose|custom
workflow_link = ""
arguments = "-d -e FLEX_NODE_ID=publisher -p 8080:8080"

[DEPENDENCIES:edge1]
lib_deps= flexCommunicator

[REQUIREMENTS:edge1]
architecture= intel
os=linux
cpu: 0.5
memory: 128Mi
devices: none
