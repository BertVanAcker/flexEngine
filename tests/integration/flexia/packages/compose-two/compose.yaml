services:
  api:
    build: ./api
    environment:
      GREETING: ${GREETING:-hello from compose}
      PORT: "8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 2s
      retries: 3
    restart: unless-stopped
  worker:
    image: mirror.gcr.io/library/python:3.13-alpine
    command: ["python", "-u", "-c", "import os, time\nprint('worker', os.environ['MODE'], flush=True)\nwhile True: time.sleep(1)"]
    environment:
      - MODE=worker
    depends_on:
      - api
