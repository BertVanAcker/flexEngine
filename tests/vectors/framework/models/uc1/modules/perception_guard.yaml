apiVersion: flex.dev/v1alpha1
kind: Module
metadata:
  name: perception_guard
  version: 0.2.0
  description: >-
    Detects persons/animals in camera frames, publishes detections, a heartbeat for the safety-side
    watchdog and stop requests. Supervisory only, not the certified safety function (WS9).
spec:
  language: python
  ports:
    - name: image
      direction: in
      type: uc1/Image
      qos: {reliability: best_effort, depth: 1}
    - name: detections
      direction: out
      type: uc1/Detections
      qos: {reliability: reliable, depth: 5, rate_hz: 15}
    - name: heartbeat
      direction: out
      type: uc1/SafetyHeartbeat
      qos: {reliability: reliable, depth: 1, rate_hz: 20, deadline_ms: 100}
      description: Safety-channel heartbeat into the safety gateway (P7 frame, absolute periodic timer).
    - name: fleet_heartbeat
      direction: out
      type: uc1/Heartbeat
      qos: {reliability: best_effort, depth: 1, rate_hz: 1}
      description: flex<->flex liveness for logging and fleet dashboards (not a safety input).
    - name: stop_request
      direction: out
      type: uc1/StopRequest
      qos: {reliability: reliable, durability: transient_local, depth: 1}
    - name: status
      pattern: rpc
      direction: in
      request: uc1/GuardStatusRequest
      response: uc1/GuardStatus
  parameters:
    - {name: score_threshold, type: float32, default: 0.6, min: 0.0, max: 1.0}
    - {name: model_id, type: string, default: "yolo11n-agri-2026.09"}
    - {name: heartbeat_period_ms, type: uint32, default: 50, min: 10, max: 1000, unit: ms}
    - {name: channel_id, type: uint16, default: 1793, description: "Connection id 0x0701 put into every SafetyHeartbeat frame."}
    - {name: last_gasp, type: bool, default: true, description: "Send one frame with DETECTOR_OK = 0 before going fail-silent (FE-S3)."}
  lifecycle: {profile: managed, startup_timeout_ms: 20000}
  resources:
    cpu_cores: 2
    memory_mb: 1500
    accelerator: {kind: gpu, min_tops: 20}
  requires:
    target_classes: [T2]
    runtimes: [python3, cuda]
