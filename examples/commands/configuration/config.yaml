logging:
  level: "DEBUG"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/syslog_local.log"
  remote: True

flexCloud:
  storage_type: "global"
  redis_host: "localhost"
  redis_port: 6379
  redis_db: 6

deviceCredentials:
  name: "flexCloudConnector"
  platformID: "Oberon-5"             #ID used to link application to device e.g. in AADL
  primaryHardwareID: "Oberon-5"   #ID generated by flexCloud
  projectID: "sandbox"            #Project allocation, based on flexCloud
  key: "3fg445"                   #Unique key generated by flexCloud
  shared_secret: b"\xb4VpN\x05\xb2l\xf1V\xbf#\x95\x19/?'\x98d@\x13Y\x8a\x8c+\xcb\xfc\x82]\n[\x85W"          #Unique shared key to verify commands and messages

heartbeat:
  heartbeat_interval: 10          #Heartbeat renewal every x seconds
  ttl: 12                         #Heartbeat time-to-live in x seconds