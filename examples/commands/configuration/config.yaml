  primaryHardwareID: "Oberon-5"   #ID generated by flexCloud
  projectID: "sandbox"            #Project allocation, based on flexCloud
  key: "3fg445"                   #Unique key generated by flexCloud
  shared_secret: b'j\r\x91\xa28\xce\xcb!\xb0\xf9\x99\x19\xdc1\xdb\xab\xc9\x8c\xe9b\x89\x98\x93\xf3\xb0\xdd\x90\xa7O<\xec\x93'          #Unique shared key to verify commands and messages

heartbeat:
