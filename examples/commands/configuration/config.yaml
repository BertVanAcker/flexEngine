logging:
  level: "DEBUG"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/syslog_local.log"
  remote: True

flexCloud:
  storage_type: "global"
  redis_host: "localhost"
  redis_port: 6379
  redis_db: 6

