[flexIA]
projectID = sandbox
description = Sandbox project

[PACKAGE]
name = flexia-robosapiens-example
tag = flexia_robosapiens_example

# DEPLOYMENT OPTIONS
[DEPLOYMENT:option1]
devices = xeon,lattepandaD3

[DEPLOYMENT:option2]
devices = local

# DEVICE SPECIFIC DESCRIPTORS
[build:xeon1]
workflow = docker-compose
workflow_link = Realization/ManagingSystem/Platform/xeon1/compose.yaml
arguments = ""

[run:xeon1]
workflow = docker-compose
workflow_link = Realization/ManagingSystem/Platform/xeon1/compose.yaml
arguments = ""

[build:lattepandaD3]
workflow = docker-compose
workflow_link = Realization/ManagingSystem/Platform/lattepandaD3/compose.yaml
arguments = ""

[run:lattepandaD3]
workflow = docker-compose
workflow_link = Realization/ManagingSystem/Platform/lattepandaD3/compose.yaml
arguments = ""

[build:local]
workflow = docker-compose
workflow_link = Realization/ManagingSystem/Platform/local/compose.yaml
arguments = ""

[run:local]
workflow = docker-compose
workflow_link = Realization/ManagingSystem/Platform/local/compose.yaml
arguments = ""

#DEVICE DEPENDENCIES
[DEPENDENCIES:xeon1]
depends_on = lattepandaD3
lib_deps= robosapiensio==0.3.21, paho-mqtt==2.1.0

[DEPENDENCIES:lattepandaD3]
lib_deps= robosapiensio==0.3.21, paho-mqtt==2.1.0

# REQUIREMENTS TO RUN THE DEVICE-SPECIFIC APP ON DEVICE
[REQUIREMENTS:xeon1]
architecture= intel
os=generic
cpu: 0.5
memory: 200Mi
devices: wlan

[REQUIREMENTS:lattepandaD3]
architecture= intel
os=linux
cpu: 0.5
memory: 100Mi
devices: wlan,gpio

[REQUIREMENTS:local]
cpu: 2
memory: 300Mi
devices: wlan
